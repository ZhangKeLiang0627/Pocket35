; PlatformIO Project Configuration File
;
;   Pocket35 - ESP32-S3-Touch-LCD-3.5 + KT6368A BLE bridge
;
;   Arch reference: https://github.com/Forairaaaaa/Rachel
;   Render: LovyanGFX (no LVGL)

[env:pocket35]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -Isrc/pocket35
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE=1
    -std=gnu++17
    -O2
    -DSENSORLIB_EXCLUDE_ALL=1
    -DSENSORLIB_EXCLUDE_IMU=0
    -DSENSORLIB_EXCLUDE_BHI=1
    -DSENSORLIB_EXCLUDE_RTC=0
    -DSENSORLIB_EXCLUDE_PCF8563=1
    -DSENSORLIB_EXCLUDE_PMIC=0
    -DSENSORLIB_EXCLUDE_PMIC_AXP192=1
    -DSENSORLIB_EXCLUDE_PMIC_AXP202=1
    -DSENSORLIB_EXCLUDE_PMIC_AXP517=1
    -DSENSORLIB_EXCLUDE_PMIC_SY6970=1
    -DSENSORLIB_EXCLUDE_PMIC_BQ25896=1

build_unflags =
    -std=gnu++11

lib_deps =
    https://github.com/Forairaaaaa/Mooncake.git#v2.3.3
    lovyan03/LovyanGFX @ 1.2.36
    h2zero/NimBLE-Arduino @ 2.5.2
    https://github.com/lewisxhe/SensorLib.git#v0.5.1
    lvgl/lvgl @ 9.5.0
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
